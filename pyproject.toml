[project]
name = "mcz-local"
version = "0.1.0"
description = "Home-Assistant-Integration für MCZ-Pelletöfen (Maestro) ohne Cloud"
requires-python = ">=3.14"
license = "Apache-2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true
